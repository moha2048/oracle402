<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle402 · Agent spending dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b0b0c'/%3E%3Ccircle cx='12' cy='12' r='8' fill='none' stroke='%23f5f6f8' stroke-opacity='.55'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23f5f6f8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#0b0b0c;--panel:transparent;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
    --text:#f5f6f8;--muted:#8a8f98;--accent:#3b6bff;--ok:#3ddc97;--warn:#f5b942;--danger:#ff5a5f;
    --grid:rgba(120,150,255,.06);--bracket:rgba(255,255,255,.25);
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  /* faint grid behind the top of the page, fading out */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:48px 48px;background-position:center -1px;
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 25%,#000 35%,transparent 85%);mask-image:radial-gradient(ellipse 75% 65% at 50% 25%,#000 35%,transparent 85%)}
  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 32px}
  .label,th{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .mono{font-family:var(--mono)}
  .num{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* nav */
  .top{position:relative;z-index:1;border-bottom:1px solid var(--line);background:rgba(11,11,12,.7);backdrop-filter:blur(6px)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .brand{display:flex;align-items:center;gap:10px;font:500 17px/1 var(--sans);letter-spacing:-.01em}
  .brand .n{font-family:var(--mono);font-weight:500;color:var(--muted)}
  .brand .sub{margin-left:12px;padding-left:14px;border-left:1px solid var(--line)}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
  .badge.ok::before{background:var(--ok)}
  .badge.warn{color:var(--warn);border-color:rgba(245,185,66,.3)}.badge.warn::before{background:var(--warn);animation:blink 1.2s ease-in-out infinite}
  .badge.danger{color:var(--danger);border-color:rgba(255,90,95,.4)}.badge.danger::before{background:var(--danger)}
  .badge.live{color:var(--text)}.badge.live::before{background:var(--text);animation:blink 1s ease-in-out infinite}
  .badge.soft::before{background:var(--warn)}

  /* hero */
  .hero{position:relative;margin-top:10px;padding:20px 40px 22px;display:grid;grid-template-columns:1fr minmax(320px,440px);gap:40px;align-items:end}
  .br{position:absolute;width:14px;height:14px;border:0 solid var(--bracket)}
  .br.tl{top:0;left:0;border-top-width:1px;border-left-width:1px}.br.tr{top:0;right:0;border-top-width:1px;border-right-width:1px}
  .br.bl{bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}.br.bra{bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}
  h1{font:300 clamp(36px,4.4vw,56px)/1.04 var(--sans);letter-spacing:-.02em;margin:0}
  .lede{color:var(--muted);margin:0;font-size:16px;max-width:34ch}
  .figures{text-align:right}
  .hero-num{font:300 clamp(52px,5.8vw,76px)/1 var(--sans);letter-spacing:-.03em;margin:6px 0 8px;white-space:nowrap}
  .of{display:flex;justify-content:flex-end;align-items:baseline;gap:14px}
  .half-num{font:300 clamp(26px,3vw,36px)/1 var(--sans);letter-spacing:-.02em;color:var(--text);white-space:nowrap}
  .cur{color:var(--muted);margin-right:.04em}
  .unit{font:500 12px/1 var(--mono);letter-spacing:.1em;color:var(--muted);margin-left:10px;vertical-align:middle}
  .meter{position:relative;height:2px;background:var(--line-strong);margin:16px 0 0}
  #fill{height:100%;width:0;background:var(--accent);transition:width .4s ease,background-color .3s ease}
  #mark{position:absolute;top:-5px;width:1px;height:12px;background:var(--text);opacity:.7;transition:left .4s ease}
  #mark::after{content:"approval";position:absolute;top:16px;left:0;transform:translateX(-50%);font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .meter-ends{display:flex;justify-content:space-between;margin-top:8px;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}

  /* stat strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:12px}
  .stat{padding:10px 24px 12px;border-left:1px solid var(--line);min-width:0}
  .stat:first-child{border-left:0}
  .stat .v{font:300 26px/1.1 var(--sans);letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v small{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted);margin-left:8px}

  /* buttons */
  button{font:inherit;color:inherit}
  .btn{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--sans);border-radius:999px;padding:11px 18px;border:1px solid var(--line-strong);background:transparent;color:var(--text);cursor:pointer;transition:border-color .15s,background-color .15s,color .15s,opacity .15s;white-space:nowrap}
  .btn:hover{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.03)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#5480ff;border-color:#5480ff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.quiet{color:var(--muted)}.btn.quiet:hover{color:var(--text)}
  .btn.danger{color:var(--danger);border-color:rgba(255,90,95,.55)}
  .btn.danger:hover{background:rgba(255,90,95,.09);border-color:var(--danger)}
  .btn.danger::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--danger)}
  .btn.go::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .chip{padding:7px 14px;font-size:13px;color:var(--muted)}
  .chip:hover{color:var(--text)}

  /* ask */
  .ask{padding-top:14px}
  .askrow{display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line-strong);padding:0 0 6px;margin-top:4px;transition:border-color .2s}
  .askrow:focus-within{border-color:var(--accent)}
  #q{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:300 20px/1.3 var(--sans);letter-spacing:-.01em;padding:4px 0}
  #q::placeholder{color:#5b6068}
  #ask svg{transition:transform .15s}#ask:not(:disabled):hover svg{transform:translateX(2px)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #answer{white-space:pre-wrap;line-height:1.55;margin:10px 0 0;max-width:118ch;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  #answer.open{-webkit-line-clamp:unset}
  #answer:empty{display:none}

  /* controls */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .controls .label{margin-right:8px}
  .controls .spacer{flex:1}

  /* ledger + trace */
  .panels{display:grid;grid-template-columns:1fr;column-gap:56px;padding-bottom:64px}
  @media (min-width:1100px){.panels{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
  .panel{min-width:0}
  .panel h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;padding:16px 0 10px;border-bottom:1px solid var(--line)}
  .panel h2 .label{color:var(--text)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;padding:10px 12px 8px 0;white-space:nowrap}
  td{padding:9px 12px 9px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
  tbody tr:first-child td{border-top:0}
  td.t{font:400 12.5px/1.5 var(--mono);color:var(--muted);white-space:nowrap}
  .tk{font:500 13px/1.4 var(--mono)}
  .q{color:var(--muted);font-size:12.5px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.amt{font:400 13px/1.5 var(--mono);white-space:nowrap}
  .st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px}
  .dot{position:relative;display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ring 1.4s ease-out infinite}
  .st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.danger{color:var(--danger)}
  .sub{font:400 11.5px/1.5 var(--mono);color:var(--muted);margin-top:3px;letter-spacing:.02em}
  .tag{font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--warn);border:1px solid rgba(245,185,66,.4);border-radius:999px;padding:3px 6px;margin-left:6px}
  td.id{font:400 12.5px/1.5 var(--mono);white-space:nowrap}
  .rs{display:block;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.reason{color:var(--muted);font-size:13px;line-height:1.5}
  tr.refused .tk,tr.refused td.amt{color:var(--muted)}
  .empty{color:var(--muted);padding:22px 0;font-size:14px}

  .timeline{list-style:none;margin:0;padding:14px 0 0;max-height:400px;overflow:auto;-webkit-mask-image:linear-gradient(transparent 0,#000 22px);mask-image:linear-gradient(transparent 0,#000 22px)}
  .timeline li{position:relative;padding:9px 0 9px 26px}
  .timeline li::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line-strong)}
  .timeline li:first-child::before{top:16px}.timeline li:last-child::before{bottom:calc(100% - 16px)}
  .timeline li .dot{position:absolute;left:0;top:15px;color:var(--muted)}
  .timeline .meta{display:flex;gap:12px;align-items:baseline;font:500 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .timeline .meta .k{color:var(--text)}
  .timeline .msg{color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .timeline li.k-user .msg,.timeline li.k-answer .msg{color:var(--text)}
  .timeline li.ok .dot,.timeline li.ok .k{color:var(--ok)}
  .timeline li.warn .dot,.timeline li.warn .k{color:var(--warn)}
  .timeline li.danger .dot,.timeline li.danger .k{color:var(--danger)}
  .timeline li.k-user .dot,.timeline li.k-answer .dot{color:var(--text)}

  /* approval modal */
  .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:16px}
  .modal.on{display:flex}
  .modal .box{position:relative;width:100%;max-width:480px;background:#0f0f11;border:1px solid var(--line-strong);border-radius:4px;padding:34px 34px 30px;animation:pop .2s ease-out both}
  .modal .head{display:flex;align-items:center;gap:10px;color:var(--warn)}
  .modal .head .label{color:var(--warn)}
  #mtext{font-size:16px;line-height:1.6;margin:18px 0 26px;overflow-wrap:anywhere}
  .modal .actions{display:flex;gap:10px;flex-wrap:wrap}

  /* motion */
  .new{animation:enter .22s ease-out both}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes ring{from{transform:scale(1);opacity:.65}to{transform:scale(3);opacity:0}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* responsive */
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:28px;padding:28px 24px 32px}
    .figures{text-align:left}
  }
  @media (max-width:720px){
    .stats{grid-template-columns:1fr 1fr}
    .stat:nth-child(3){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .stat{padding:16px 16px 18px}
    .stat .v{font-size:22px}
    .brand .sub{display:none}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px}
    .hero{padding:24px 18px 28px}
    #q{font-size:18px}
    .controls .spacer{display:none}
    /* ledger rows become stacked cards */
    thead{display:none}
    table,tbody,td{display:block}
    tbody tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;padding:12px 0;border-top:1px solid var(--line)}
    tbody tr:first-child{border-top:0}
    td{border:0!important;padding:0}
    td.amt{text-align:right}
    td:nth-child(4),td:nth-child(5){grid-column:2/4;margin-top:6px}
    td.empty{grid-column:1/-1}
    .q{max-width:none}
  }
</style></head><body>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10.5" stroke="currentColor" stroke-opacity=".55"/><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="18.2" cy="5.8" r="1.6" fill="currentColor"/></svg>
    <span>Oracle<span class="n">402</span></span>
  </div>
  <div class="badges"><span id="b-llm" class="badge"></span><span id="b-pay" class="badge"></span><span id="b-run" class="badge"></span></div>
</div></header>

<main class="wrap">
  <section class="hero" aria-label="Budget">
    <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br bra"></i>
    <div>
      <h1>Agent spending,<br>under control.</h1>
    </div>
    <div class="figures">
      <div class="label">Spent</div>
      <div class="hero-num num"><span class="cur">$</span><span id="spent">0.000</span></div>
      <div class="of"><span class="label">Of budget</span><span class="half-num num"><span class="cur">$</span><span id="budget">0.000</span><span class="unit">USDC</span></span></div>
      <div class="meter" role="presentation"><div id="fill" style="width:0%"></div><div id="mark"></div></div>
      <div class="meter-ends"><span>0</span><span>CAP</span></div>
    </div>
  </section>

  <section class="stats" aria-label="Policy limits">
    <div class="stat"><div class="label">Remaining</div><div class="v num"><span id="remaining">0.000</span><small>USDC</small></div></div>
    <div class="stat"><div class="label">Approval above</div><div class="v num"><span id="appr">0.000</span><small>USDC</small></div></div>
    <div class="stat"><div class="label">Max per call</div><div class="v num"><span id="maxcall">0.000</span><small>USDC</small></div></div>
    <div class="stat"><div class="label">Gateway balance</div><div class="v num"><span id="gbal">n/a</span><small>USDC</small></div></div>
  </section>

  <section class="ask" aria-label="Ask the agent">
    <label class="label" for="q">Ask the agent</label>
    <div class="askrow">
      <input type="text" id="q" autocomplete="off" placeholder="What are the odds on the Fed decision in December?">
      <button class="btn primary" id="ask">Ask <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="chips">
      <button class="btn chip" data-q="What are the odds on the Fed decision in December?">Fed December?</button>
      <button class="btn chip" data-q="Where is the market expecting BTC on November 30?">BTC Nov 30?</button>
      <button class="btn chip" data-q="Will crypto market structure legislation become law?">Crypto bill?</button>
    </div>
    <div id="answer" aria-live="polite"></div>
  </section>

  <section class="controls" aria-label="Safety controls">
    <button class="btn danger" id="kill">Kill switch</button>
    <button class="btn go" id="resume" style="display:none">Resume spending</button>
    <span class="spacer"></span>
    <button class="btn quiet" id="raise">Raise budget +0.01</button>
    <button class="btn quiet" id="resetSpend">Reset spend</button>
  </section>

  <div class="panels">
    <section class="panel" aria-label="Payment ledger">
      <h2><span class="label">Payment ledger</span><span class="label" id="ledgerCount"></span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Time</th><th>Market</th><th>Amount</th><th>Status</th><th>Transfer</th></tr></thead>
        <tbody id="ledger"></tbody>
      </table></div>
    </section>
    <section class="panel" aria-label="Decision trace">
      <h2><span class="label">Decision trace</span><span class="label" id="traceCount"></span></h2>
      <ol class="timeline" id="trace"></ol>
    </section>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mhead"><div class="box">
  <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br bra"></i>
  <div class="head"><span class="dot pulse"></span><span class="label" id="mhead">Human approval required</span></div>
  <p id="mtext"></p>
  <div class="actions"><button class="btn primary" id="yes">Approve</button><button class="btn" id="no">Deny</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id), post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
let last={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

// USDC amounts: at least 3 decimals, more only when the value needs them (max 6).
const decs=v=>{const f=(Number(v)||0).toFixed(6).replace(/0+$/,'');return Math.max(3,(f.split('.')[1]||'').length);};
const fmt=v=>{const n=Number(v);return Number.isFinite(n)?n.toFixed(decs(n)):'n/a';};
// Ease a number between values so spend visibly ticks up.
function setNum(el,v){
  const to=Number(v);
  if(v===null||v===undefined||!Number.isFinite(to)){cancelAnimationFrame(el._raf);el.dataset.v='';el.textContent='n/a';return;}
  const from=el.dataset.v===''||el.dataset.v===undefined?NaN:Number(el.dataset.v);
  if(from===to)return;
  el.dataset.v=String(to);cancelAnimationFrame(el._raf);
  const d=Math.max(decs(to),Number.isFinite(from)?decs(from):3);
  if(reduced||!Number.isFinite(from)){el.textContent=to.toFixed(d);return;}
  const t0=performance.now(),dur=400;
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(d);if(p<1)el._raf=requestAnimationFrame(step);};
  el._raf=requestAnimationFrame(step);
}
const clock=iso=>new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const shortId=s=>s&&s.length>18?s.slice(0,8)+'…'+s.slice(-4):s;

// The server ledger holds paid rows only. Refusals (policy blocks, human denials, failed payments)
// are reconstructed for display from the decision trace; a pending approval is shown as a live row.
function refusals(trace){
  const out=[];let tk='',q='';
  for(const t of trace){
    if(t.kind==='user')q=t.msg;
    else if(t.kind==='tool'){const m=/^buy_forecast\("(.*)"\)/.exec(t.msg);if(m)tk=m[1];}
    else if(t.kind==='policy'&&/^DENIED:/.test(t.msg))out.push({key:'b'+t.t+t.msg,at:t.t,ticker:tk,question:q,status:'blocked',reason:t.msg.replace(/^DENIED:\s*/,'')});
    else if(t.kind==='policy'&&/^Human denied/.test(t.msg))out.push({key:'d'+t.t,at:t.t,ticker:tk,question:q,status:'denied',reason:'Denied by a human (or timed out). No payment made.'});
    else if(t.kind==='error'&&/^payment failed/.test(t.msg))out.push({key:'f'+t.t,at:t.t,ticker:tk,question:q,status:'failed',reason:t.msg});
  }
  return out;
}
const ST={paid:['ok','paid'],awaiting:['warn','awaiting'],denied:['danger','denied'],blocked:['danger','blocked'],failed:['danger','failed']};
function traceTone(t){
  if(t.kind==='payment')return'ok';
  if(t.kind==='error')return'danger';
  if(t.kind==='policy'){
    if(/^DENIED|^Human denied/.test(t.msg))return'danger';
    if(/^APPROVAL/.test(t.msg))return'warn';
    return'ok';
  }
  return'';
}
const seen={ledger:new Set(),trace:new Set()},sig={ledger:'',trace:''};let first=true;

async function tick(){
  let s; try{ s=await (await fetch('/api/state')).json(); }catch{ return; } last=s;
  setNum($('spent'),s.spentUsdc); setNum($('budget'),s.budgetUsdc); setNum($('remaining'),s.remainingUsdc);
  setNum($('appr'),s.approveAfterUsdc); setNum($('maxcall'),s.maxPerCallUsdc);
  setNum($('gbal'),s.gatewayBalanceUsdc===null||s.gatewayBalanceUsdc===undefined?null:Number(s.gatewayBalanceUsdc));
  const pct=s.budgetUsdc?Math.min(100,s.spentUsdc/s.budgetUsdc*100):100; $('fill').style.width=pct+'%';
  $('fill').style.background=s.killed||pct>=100?'var(--danger)':pct>=s.approveAfterUsdc/s.budgetUsdc*100?'var(--warn)':'var(--accent)';
  $('mark').style.left=(s.budgetUsdc?s.approveAfterUsdc/s.budgetUsdc*100:0)+'%';
  $('kill').style.display=s.killed?'none':''; $('resume').style.display=s.killed?'':'none';
  $('b-llm').textContent=s.mode.llm?'LLM mode':'Scripted mode'; $('b-llm').className='badge '+(s.mode.llm?'ok':'soft');
  $('b-pay').textContent=s.mode.mockPay?'Mock pay':'Live pay · Arc testnet'; $('b-pay').className='badge '+(s.mode.mockPay?'soft':'ok');
  $('b-run').textContent=s.killed?'Killed':s.pending?'Awaiting approval':s.running?'Running':'Idle';
  $('b-run').className='badge '+(s.killed?'danger':s.pending?'warn':s.running?'live':'');
  $('ask').disabled=s.running; $('answer').textContent=s.lastAnswer||'';

  // ledger: paid rows from the server + refusals from the trace + the pending approval, newest first
  const rows=s.ledger.map(r=>({key:'p'+r.at+r.ticker,at:r.at,ticker:r.ticker,question:r.question,status:'paid',r}))
    .concat(refusals(s.trace));
  if(s.pending){
    const ask=[...s.trace].reverse().find(t=>t.kind==='policy'&&/^APPROVAL/.test(t.msg));
    rows.push({key:'w'+s.pending.id,at:ask?ask.t:new Date().toISOString(),ticker:s.pending.ticker,question:'',status:'awaiting',amount:s.pending.priceUsdc,reason:s.pending.reason});
  }
  rows.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
  const ls=rows.map(r=>r.key+r.status).join('|');
  if(ls!==sig.ledger){
    sig.ledger=ls;
    $('ledger').innerHTML=rows.map(x=>{
      const [tone,label]=ST[x.status], isNew=!first&&!seen.ledger.has(x.key); seen.ledger.add(x.key);
      const ev=`<div class="tk" title="${esc(x.question||'')}">${esc(x.ticker||'n/a')}</div>`;
      if(x.status==='paid'){const r=x.r;
        return `<tr class="${isNew?'new':''}"><td class="t">${clock(r.at)}</td><td>${ev}</td><td class="amt">${fmt(r.amountUsdc)}</td>`+
          `<td><span class="st ${tone}"><span class="dot"></span>${label}</span>${r.mock?'<span class="tag">MOCK</span>':''}${r.approvedByHuman?'<span class="tag">HUMAN</span>':''}</td>`+
          `<td class="id"><span title="${esc(r.transaction||'')}">${esc(shortId(r.transaction)||'n/a')}</span></td></tr>`;
      }
      return `<tr class="refused ${isNew?'new':''}"><td class="t">${clock(x.at)}</td><td>${ev}</td><td class="amt">${x.amount!==undefined?fmt(x.amount):'none'}</td>`+
        `<td><span class="st ${tone}"><span class="dot${x.status==='awaiting'?' pulse':''}"></span>${label}</span></td><td class="reason" title="${esc(x.reason)}"><span class="rs">${esc(x.reason)}</span></td></tr>`;
    }).join('')||'<tr><td colspan="5" class="empty">No payments yet.</td></tr>';
    const paid=s.ledger.length, refused=rows.filter(r=>['denied','blocked','failed'].includes(r.status)).length;
    $('ledgerCount').textContent=`${paid} paid · ${refused} refused${s.pending?' · 1 awaiting':''}`;
  }

  // decision trace as a timeline (oldest first; stays pinned to the bottom unless scrolled up)
  const ts=s.trace.length?s.trace[0].t+s.trace.length+s.trace[s.trace.length-1].t:'';
  if(ts!==sig.trace){
    sig.trace=ts;
    const tr=$('trace'), atBottom=tr.scrollTop+tr.clientHeight>=tr.scrollHeight-20;
    tr.innerHTML=s.trace.map(t=>{
      const k=t.t+t.kind+t.msg, isNew=!first&&!seen.trace.has(k); seen.trace.add(k);
      return `<li class="k-${t.kind} ${traceTone(t)} ${isNew?'new':''}"><span class="dot"></span><div class="meta"><span>${clock(t.t)}</span><span class="k">${esc(t.kind)}</span></div><div class="msg" title="${esc(t.msg)}">${esc(t.msg)}</div></li>`;
    }).join('')||'<li class="empty" style="padding-left:0">The agent has not done anything yet.</li>';
    if(atBottom) tr.scrollTop=tr.scrollHeight;
    $('traceCount').textContent=String(s.trace.length);
  }
  first=false;

  if(s.pending){ $('modal').classList.add('on'); $('mtext').textContent=`Buy forecast for ${s.pending.ticker} at ${s.pending.priceUsdc} USDC? ${s.pending.reason}`; } else $('modal').classList.remove('on');
}
$('answer').onclick=()=>$('answer').classList.toggle('open');
$('ask').onclick=()=>{const q=$('q').value.trim(); if(q) post('/api/ask',{question:q});};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('ask').click();});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q; $('ask').click();});
$('kill').onclick=()=>post('/api/kill'); $('resume').onclick=()=>post('/api/resume');
$('raise').onclick=()=>post('/api/budget',{budgetUsdc:last.budgetUsdc+0.01}); $('resetSpend').onclick=()=>post('/api/reset-spend');
$('yes').onclick=()=>post('/api/approve',{approve:true}); $('no').onclick=()=>post('/api/approve',{approve:false});
setInterval(tick,1000); tick();
</script></body></html>
